name: tests

# Sahte HTTP servisine karşı çalışan davranış testleri.
# SINIR: CI ortamında Ollama, model veya GPU YOKTUR. Gerçek model gerektiren
# hiçbir adım burada çalışmaz; bu iş akışı model kalitesi veya gerçek model
# süreleri hakkında bir şey göstermez.

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unittest:
    name: unittest (${{ matrix.os }}, Python 3.12)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Proje Windows'ta geliştiriliyor; Windows bilinçli olarak matriste.
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Bağımlılık kurulumu yok (bilinçli). requirements.txt yalnızca B modu ve
      # C --retrieval için gerekir; A/C modları ve testlerin çoğu standart
      # kütüphaneyle çalışır. Arama testleri sahte embedding kullanır. Gerçek
      # embedding modeli gerektiren testler (RealModelTest) sentence-transformers
      # veya yerel model yokken skipUnless ile atlanır; CI'da model İNDİRİLMEZ.
      # API testleri (test_api.py) fastapi yokken burada atlanır; aşağıdaki
      # "api" işinde çalışır.

      - name: Veri doğrulaması (modele istek göndermez)
        run: python experiments/first_model/run.py --validate-only

      - name: Davranış testleri
        run: python -m unittest discover -s experiments/first_model/tests -p "test_*.py" -v

  api:
    # Servis katmanı testleri. Yalnızca requirements-api.txt kurulur (fastapi,
    # uvicorn, httpx). sentence-transformers ve torch KURULMAZ (ağır ve bu testler
    # için gereksiz); bu ortamda B modu isteği arama paketi olmadığı için 503 döner.
    # Ollama ve model yoktur; C modu sahte HTTP servisine karşı çalışır.
    name: api (ubuntu-latest, Python 3.12)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Servis bağımlılıkları
        run: python -m pip install -r requirements-api.txt

      - name: API testleri
        run: python -m unittest discover -s experiments/first_model/tests -p "test_api.py" -v
